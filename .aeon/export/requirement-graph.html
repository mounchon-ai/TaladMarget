<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เอกสารความต้องการ — talad</title>
<style>
/* Petrol ground against a cool grey sheet. Deliberately NOT cream-and-terracotta: the status scale
   below is the palette, and a warm neutral cannot carry five signal steps without two of them
   reading the same. Every colour here names a state the document really has.
   NOTE: no backticks and no backslashes anywhere in this stylesheet or the script below — both live
   in a JS template literal, and a stray one silently ends the string or rewrites a character. */
:root{
  --ink:#1E2A32;--ink-2:#2A3944;--ink-fg:#EBEFF1;--ink-muted:#9FB0BA;
  --bg:#E6EAE9;--sheet:#FFFFFF;--rail:#F2F4F3;--fg:#1B2227;--muted:#5B6870;--line:#D2D9D6;
  --accent:#2D6E93;--accent-soft:#E2EDF3;--code-bg:#EEF2F1;
  --s-done:#2E7D5B;--s-partial:#C68A2E;--s-blocked:#B33A2B;--s-empty:#8794A0;--s-none:#5A6670;
  --s-done-soft:#E4F1EA;--s-partial-soft:#F8EEDC;--s-blocked-soft:#F7E3DF;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12191D;--sheet:#1A242A;--rail:#162025;--fg:#E6EAEC;--muted:#95A3AC;--line:#2E3C45;
    --accent:#71B4D8;--accent-soft:#1D3441;--code-bg:#121B20;
    --s-done:#4FA97C;--s-partial:#DCA84E;--s-blocked:#D9614E;--s-empty:#7D8B95;--s-none:#66737C;
    --s-done-soft:#1B3128;--s-partial-soft:#352B19;--s-blocked-soft:#3A211D}
}
*{box-sizing:border-box}
html,body{height:100%}
/* Flex column rather than a hard-coded calc() on the viewport height: the band's height depends on
   how many sections wrap and how long the directive is, so any number written here would be wrong
   on some spec. */
body{margin:0;font:15px/1.7 "Leelawadee UI","Noto Sans Thai","Sarabun","Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--fg);display:flex;flex-direction:column;height:100vh;overflow:hidden}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
code{font:.9em/1.4 ui-monospace,"Cascadia Mono",Consolas,monospace}
a{color:var(--accent)}

/* ── the band: title, the eight-segment spine, and the one directive ── */
.band{flex:none;background:var(--ink);color:var(--ink-fg);padding:12px 20px 14px}
.band .top{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.band h1{font-size:17px;margin:0;font-weight:650}
.band .sum{color:var(--ink-muted);font-size:12.5px}
.band .warn{color:#E8A093;font-weight:600}
.band .views{margin-left:auto;display:flex;gap:4px}
.band .views a{color:var(--ink-muted);text-decoration:none;font-size:13px;padding:3px 10px;border-radius:4px}
.band .views a:hover{color:#fff}
.band .views a[aria-current=page]{background:var(--ink-2);color:#fff}
/* The spine IS the document's section order — a real sequence, so the numbers carry information. */
.spine{display:flex;gap:3px;margin:0 0 10px;padding:0;list-style:none}
.spine li{flex:1;min-width:0}
.spine a{display:block;background:var(--ink-2);border-radius:3px;color:#AEBEC7;text-decoration:none;overflow:hidden}
.spine .bar{display:block;height:6px;background:var(--s-empty)}
.spine .no{display:block;padding:4px 8px 5px;font-size:11.5px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.spine a:hover .no{color:#fff}
.spine a[aria-current=true]{outline:2px solid var(--ink-fg);outline-offset:1px}
/* Each segment is tinted with its own state, hand-mixed against the petrol rather than left to
   color-mix(), and the state is ALSO carried by the icon in the label — a spine that encodes status
   only in hue is unreadable to a colour-blind reviewer. */
.spine .st-done{background:#1F3B33}   .spine .st-done .bar{background:var(--s-done)}
.spine .st-partial{background:#3A3524} .spine .st-partial .bar{background:var(--s-partial)}
.spine .st-blocked{background:#3B2622} .spine .st-blocked .bar{background:var(--s-blocked)}
.spine .st-none{background:#252F36}    .spine .st-none .bar{background:var(--s-none)}
.directive{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;background:var(--ink-2);border-left:3px solid var(--s-partial);padding:7px 12px;border-radius:4px;font-size:13px}
.directive.ok{border-left-color:var(--s-done)}
.directive .lead{color:var(--ink-muted)}
.directive code{background:#0F161B;color:#B8DCEF;padding:2px 8px;border-radius:4px}
.directive .why{color:var(--ink-muted);font-size:12.5px}

/* ── the shell: the menu on the left, one thing at a time in the middle ── */
.shell{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr}
.rail{overflow:auto;background:var(--rail);border-right:1px solid var(--line);padding:14px 10px 20px}
#search{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:inherit;font:inherit;font-size:13.5px;margin-bottom:10px}
.toc,.toc ol{list-style:none;margin:0;padding:0}
.toc a{display:flex;gap:9px;align-items:baseline;padding:5px 8px;border-radius:5px;color:var(--fg);text-decoration:none;font-size:13.5px;line-height:1.45}
.toc a:hover{background:var(--line)}
.toc a[aria-current=page]{background:var(--sheet);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.toc .n{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400;padding-left:6px}
.toc .top-link{font-weight:600}
.toc .sub{margin:2px 0 6px 17px;border-left:1px solid var(--line);padding-left:4px}
.toc .sub a{font-size:13px;padding:4px 8px}
.toc .sub .rid{color:var(--muted);font:11.5px ui-monospace,Consolas,monospace;flex:none}
.toc .sub .rt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc .sep{height:1px;background:var(--line);margin:10px 6px}
.pip{width:9px;height:9px;border-radius:2px;flex:none;display:inline-block;background:var(--s-empty);align-self:center}
.st-done>.pip,.pip.st-done{background:var(--s-done)}
.st-partial>.pip,.pip.st-partial{background:var(--s-partial)}
.st-blocked>.pip,.pip.st-blocked{background:var(--s-blocked)}
.st-none>.pip,.pip.st-none{background:var(--s-none)}
#results a .rid{color:var(--accent);font:12px ui-monospace,Consolas,monospace;flex:none}
#results .none{color:var(--muted);font-size:13px;padding:4px 8px}
.rail .note{color:var(--muted);font-size:11.5px;line-height:1.55;margin:18px 8px 0}

/* ── the reading column ── */
.doc{overflow:auto;background:var(--sheet)}
#view{max-width:48rem;margin:0 auto;padding:26px 36px 80px}
.crumbs{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.crumbs a{color:var(--muted)}
#view h1{font-size:23px;line-height:1.35;margin:0 0 6px;font-weight:650}
/* focus is moved here on every navigation so a screen reader lands on the new view; the ring would only repeat what the reader just clicked */
#view h1:focus{outline:none}
#view h2{font-size:16.5px;margin:34px 0 10px;font-weight:650}
#view p{margin:0 0 12px}
.idline{color:var(--muted);font-size:13px;margin:0 0 18px}
.idline code{color:var(--accent)}
.state{display:flex;gap:8px;align-items:baseline;font-size:14px;margin:4px 0 6px}
.state .pip{align-self:auto;transform:translateY(1px)}
.nextcmd{font-size:13.5px;color:var(--muted)}
.nextcmd code,.gap code{background:var(--code-bg);padding:1px 7px;border-radius:4px;color:var(--fg)}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:4px 18px;margin:14px 0 8px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;word-break:break-word}
.gap{background:var(--rail);border:1px dashed var(--line);border-radius:6px;padding:10px 14px;color:var(--muted);font-size:14px}
.warnbox{background:var(--s-partial-soft);border-left:3px solid var(--s-partial);padding:10px 14px;border-radius:4px;font-size:13.5px;margin:18px 0}
.warnbox ul{margin:6px 0 0;padding-left:18px}
.ref{font:.92em ui-monospace,"Cascadia Mono",Consolas,monospace;text-decoration:none;white-space:nowrap}
.ref:hover{text-decoration:underline}
.ref.missing{color:var(--s-blocked)}
.chip{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;line-height:1.6}
.tablewrap{overflow-x:auto;margin:10px 0 6px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line);padding:6px 10px 6px 0}
td{border-bottom:1px solid var(--line);padding:7px 10px 7px 0;vertical-align:top}
tr:last-child td{border-bottom:0}

/* section list on the overview, and requirement rows on section 3 */
.seclist,.reqlist{list-style:none;margin:8px 0;padding:0}
.seclist a,.reqlist a{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:baseline;padding:11px 12px;border-radius:6px;text-decoration:none;color:var(--fg);border-bottom:1px solid var(--line)}
.seclist li:last-child a,.reqlist li:last-child a{border-bottom:0}
.seclist a:hover,.reqlist a:hover{background:var(--rail)}
.seclist .t,.reqlist .t{font-weight:600}
.seclist .d,.reqlist .d{grid-column:2/4;color:var(--muted);font-size:13px}
.seclist code{grid-column:3;grid-row:1;font-size:12px;color:var(--accent)}
.reqlist .rid{grid-column:3;grid-row:1;color:var(--muted);font:12px ui-monospace,Consolas,monospace}

/* ── a rule, and the examples that prove it — the page's one loud element ── */
.rule{border-left:4px solid var(--s-empty);background:var(--sheet);padding:4px 0 6px 18px;margin:22px 0 28px}
.rule.st-done{border-left-color:var(--s-done)}
.rule.st-partial{border-left-color:var(--s-partial)}
.rule.st-blocked{border-left-color:var(--s-blocked)}
.rulehead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.statement{font-size:17px;line-height:1.65;font-weight:500;margin:0 0 10px}
.rulemeta{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.rulemeta span+span::before{content:"  ·  "}
.example{margin:12px 0 0}
.exhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px;margin-bottom:5px}
/* given → when → then is a real sequence, so it is an ordered list and reads left to right */
.gwt{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr 1.15fr;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.gwt li{padding:9px 12px;font-size:14px;line-height:1.6;border-right:1px solid var(--line);min-width:0;word-break:break-word}
.gwt li:last-child{border-right:0;background:var(--s-done-soft)}
.gwt .l{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.flag{margin:12px 0 0;padding:9px 13px;border-radius:5px;font-size:14px}
.flag.red{background:var(--s-blocked-soft)}
.flag.later{background:var(--rail)}
.flag ul{margin:4px 0 0;padding-left:18px}
.rel{list-style:none;margin:6px 0;padding:0;font-size:14px}
.rel li{padding:4px 0;border-bottom:1px solid var(--line)}
.rel .how{color:var(--muted);margin-right:8px}
.rel .sub{color:var(--muted);margin-left:8px}
.wiki{display:inline-block;margin-top:26px;font-size:14px}

/* ── the graph, as the second view ── */
.graphview{position:relative;overflow:hidden;background:var(--bg)}
.graphview[hidden]{display:none}
.gtools{position:absolute;left:12px;top:10px;right:12px;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;z-index:2}
.gtools .legend{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}
.gmode{display:flex;background:var(--sheet);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.gmode a{padding:4px 12px;font-size:13px;color:var(--fg);text-decoration:none}
.gmode a+a{border-left:1px solid var(--line)}
.gmode a[aria-current=true]{background:var(--ink);color:var(--ink-fg)}
.gnote{font-size:12.5px;color:var(--muted)}
.gtools button{display:flex;gap:6px;align-items:center;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);color:inherit;font:inherit;font-size:12.5px;cursor:pointer}
.gtools button[aria-pressed=false]{opacity:.4}
.gtools .dot{width:9px;height:9px;border-radius:2px}
#canvas{position:absolute;inset:0;cursor:grab}
#canvas.drag{cursor:grabbing}
svg{width:100%;height:100%;display:block}
.node rect{stroke:var(--line);stroke-width:1.2}
.node text{font-size:11px;fill:var(--fg);pointer-events:none}
.node .sub{font-size:9.5px;fill:var(--muted)}
.node{cursor:pointer}
.node.dim{opacity:.14}
.node.sel rect{stroke:var(--accent);stroke-width:2.5}
path.edge{fill:none;stroke:var(--line);stroke-width:1.1}
path.edge.dim{opacity:.08}
path.edge.hot{stroke:var(--accent);stroke-width:2}
/* locked relations: a second colour, so "what I am looking at" and "what I kept" stay tellable apart */
path.edge.lock{stroke:var(--s-partial);stroke-width:2}
.node.pinned rect{stroke:var(--s-partial);stroke-width:2.5}
.locks{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex-basis:100%;font-size:12.5px}
.locks[hidden]{display:none}
.locks .lead{color:var(--muted)}
.lockchip{display:inline-flex;align-items:center;border:1.5px solid var(--s-partial);border-radius:999px;background:var(--sheet);overflow:hidden}
.lockchip button{border:0;background:none;color:inherit;font:12px ui-monospace,Consolas,monospace;padding:2px 4px 2px 9px;cursor:pointer}
.lockchip .x{font:14px/1 system-ui,sans-serif;padding:2px 8px 2px 4px;color:var(--muted)}
.lockchip .x:hover{color:var(--s-blocked)}
.locks .clear{border:0;background:none;color:var(--accent);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline}
.lockbtn{display:block;width:100%;margin:2px 0 10px;padding:6px 10px;border:1.5px solid var(--s-partial);border-radius:6px;background:var(--sheet);color:var(--fg);font:inherit;font-size:13px;cursor:pointer;text-align:left}
.lockbtn.on{background:var(--s-partial-soft)}
#gcard .grow{display:block;margin:10px 0 0;font-size:13.5px}
.gnote code{color:var(--accent)}
.depths{display:inline-flex;align-items:center;gap:3px}
.depths button{min-width:24px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);color:inherit;font:inherit;font-size:12.5px;cursor:pointer}
.depths button[aria-pressed=true]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.colhead{font-size:11px;fill:var(--muted);font-weight:600}
.node.gap{cursor:default}
.node.gap rect{stroke:var(--s-blocked);stroke-dasharray:4 3}
.node.gap text{fill:var(--s-blocked)}
path.edge.gapline{stroke-dasharray:4 3}
/* The card is a reading surface, not a tooltip: its head stays put, its body scrolls, and the reader
   can make it bigger. It is anchored bottom-right, so it grows up and to the left — which is why the
   grip sits in the TOP-LEFT corner, where the growing edge actually is. */
#gcard{position:absolute;right:14px;bottom:14px;width:600px;max-width:calc(100% - 28px);max-height:70%;display:flex;flex-direction:column;overflow:hidden;background:var(--sheet);border:1px solid var(--line);border-radius:8px;font-size:13.5px;z-index:2;box-shadow:0 6px 24px rgba(20,32,40,.14)}
#gcard[hidden]{display:none}
#gcard.sized{max-height:none}
.ghead{flex:none;display:flex;align-items:center;gap:6px;padding:9px 10px 8px 18px;border-bottom:1px solid var(--line)}
.ghead .idline{margin:0;flex:1;min-width:0}
.ghead button{flex:none;width:28px;height:26px;border:1px solid var(--line);border-radius:5px;background:var(--sheet);color:var(--muted);font:15px/1 system-ui,sans-serif;cursor:pointer}
.ghead button:hover,.ghead button[aria-pressed=true]{color:var(--fg);border-color:var(--muted)}
.gbody{flex:1;min-height:0;overflow:auto;padding:10px 18px 16px}
.grip{position:absolute;left:0;top:0;width:16px;height:16px;cursor:nwse-resize;z-index:3;touch-action:none}
.grip::before{content:"";position:absolute;left:4px;top:4px;width:7px;height:7px;border-left:2px solid var(--muted);border-top:2px solid var(--muted);border-top-left-radius:3px;opacity:.55}
.grip:hover::before{opacity:1}
#gcard h3{font-size:16px;margin:2px 0 8px;line-height:1.45}
#gcard .statement{font-size:15px;margin:4px 0 10px}
#gcard .facts{grid-template-columns:max-content 1fr;gap:5px 14px;margin:8px 0 12px}
#gcard .facts dt{font-size:12px}
#gcard.narrow .facts{grid-template-columns:1fr;gap:0}
#gcard.narrow .facts dt{margin-top:7px}
#gcard.narrow .gwt{grid-template-columns:1fr}
#gcard.narrow .gwt li{border-right:0;border-bottom:1px solid var(--line)}
#gcard.narrow .gwt li:last-child{border-bottom:0}
#gcard .example{margin:10px 0 0}
#gcard h4{font-size:13px;margin:14px 0 4px;color:var(--muted);font-weight:600}
.rulelist{list-style:none;margin:0;padding:0}
.rulelist li{padding:6px 0;border-bottom:1px solid var(--line);line-height:1.55}
.rulelist li:last-child{border-bottom:0}
.rulelist .ref{margin-right:8px}
.rels{margin:12px 0 0}
.rels summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
#gcard .rel button{border:0;background:none;color:var(--accent);font:inherit;padding:0;cursor:pointer;text-align:left}

@media (max-width:900px){
  body{height:auto;overflow:visible}
  .shell{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line);max-height:46vh}
  #view{padding:20px 16px 60px}
  .spine .no{font-size:0;padding:0}
  .spine .bar{height:8px}
  .gwt{grid-template-columns:1fr}
  .gwt li{border-right:0;border-bottom:1px solid var(--line)}
  .gwt li:last-child{border-bottom:0}
  .graphview{height:70vh}
  #gcard{left:10px;right:10px;width:auto;max-width:none}
  #gcard .facts{grid-template-columns:1fr;gap:0}
  #gcard .facts dt{margin-top:7px}
  #gcard .gwt{grid-template-columns:1fr}
  #gcard .gwt li{border-right:0;border-bottom:1px solid var(--line)}
  #gcard .gwt li:last-child{border-bottom:0}
}
</style>
</head>
<body>
<header class="band">
  <div class="top">
    <h1>เอกสารความต้องการ — talad</h1>
    <span class="sum" id="sum"></span>
    <nav class="views" aria-label="มุมมอง"><a href="#overview" id="v-doc">เอกสาร</a><a href="#graph" id="v-graph">กราฟความสัมพันธ์</a></nav>
  </div>
  <ol class="spine" id="spine" aria-label="สถานะรายหัวข้อ"></ol>
  <div class="directive" id="directive"></div>
</header>
<div class="shell">
  <nav class="rail" aria-label="หัวข้อทั้งหมด">
    <input id="search" type="search" placeholder="ค้นหารหัสหรือข้อความ" autocomplete="off" aria-label="ค้นหารหัสหรือข้อความ">
    <div id="results" hidden></div>
    <div id="tocwrap"><ol class="toc" id="toc"></ol></div>
    <p class="note">หน้านี้สร้างจาก <code>spec.json</code> — แก้ไฟล์นี้ด้วยมือแล้วจะหายในการ render รอบถัดไป · สถานะที่เห็นคือสถานะ ณ เวลาที่ render</p>
  </nav>
  <main class="doc" id="doc"><article id="view" aria-live="polite"></article></main>
  <section class="graphview" id="graphview" hidden aria-label="กราฟความสัมพันธ์">
    <div class="gtools">
      <nav class="gmode" aria-label="รูปแบบกราฟ"><a href="#graph" id="m-cols">แบบคอลัมน์ตามชนิด</a><a href="#graph-tree" id="m-tree">แบบต้นไม้ตามความต้องการ</a></nav>
      <span class="gnote" id="gnote"></span>
      <div class="legend" id="legend"></div>
      <div class="locks" id="locks" hidden></div>
    </div>
    <div id="canvas"><svg id="svg"><g id="gview"></g></svg></div>
    <aside id="gcard" hidden aria-label="รายละเอียดของโหนดที่เลือก">
      <span class="grip" id="ggrip" title="ลากเพื่อปรับขนาด · ดับเบิลคลิกเพื่อคืนขนาดเดิม" aria-hidden="true"></span>
      <div class="ghead"><p class="idline" id="gid"></p><button type="button" id="gbig" aria-pressed="false" title="ขยายเต็มพื้นที่กราฟ">⤢</button><button type="button" id="gclose" title="ปิด" aria-label="ปิดรายละเอียด">×</button></div>
      <div class="gbody" id="gbody"></div>
    </aside>

<script>
"use strict";
var D = JSON.parse(document.getElementById("data").textContent);

// ── the model: everything is read off nodes and edges, never recomputed from a second source ──
var byId = {}, OUT = {}, IN = {}, i;
for (i = 0; i < D.nodes.length; i++) byId[D.nodes[i].id] = D.nodes[i];
D.edges.forEach(function (e) {
  if (!byId[e.from] || !byId[e.to]) return;
  (OUT[e.from] = OUT[e.from] || []).push(e);
  (IN[e.to] = IN[e.to] || []).push(e);
});
function outs(id, rel) { return (OUT[id] || []).filter(function (e) { return !rel || e.rel === rel; }).map(function (e) { return e.to; }); }
function ins(id, rel) { return (IN[id] || []).filter(function (e) { return !rel || e.rel === rel; }).map(function (e) { return e.from; }); }
function field(n, key) { for (var j = 0; j < n.detail.length; j++) if (n.detail[j][0] === key) return n.detail[j][1]; return null; }
function ofKind(k) { return D.nodes.filter(function (n) { return n.kind === k; }); }
function isOpen(id) { var s = field(byId[id], "สถานะ"); return !!s && s.indexOf("เปิดอยู่") === 0; }
function isCurrent(n) { return field(n, "ใช้อยู่") === "ใช่"; }
function base(id) { var at = id.indexOf("@"); return at === -1 ? id : id.slice(0, at); }
// a title identical to the id says nothing the line above it did not already say
function sub(n) { return n.title === n.id ? "" : n.title; }
function clip(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function label(k) { return D.kindLabel[k] || k; }

// Which of the eight sections a kind is read under — the same grouping the md document uses.
var SECTION_OF = { STK: "1", UL: "2", REQ: "3", NFR: "3", BR: "3", EX: "3", CALC: "4", GD: "4", Q: "5", DQ: "5", CHG: "6", SRC: "7" };
var secByNo = {};
D.sections.forEach(function (s) { secByNo[s.no] = s; });

// A requirement's own verdict, for the menu: the same three questions section 3 asks of the module.
function reqState(id) {
  var rules = outs(id, "owns");
  if (!rules.length) return "empty";
  if (rules.some(function (r) { return outs(r, "raises").some(isOpen); })) return "blocked";
  if (rules.some(function (r) { return !ins(r, "proves").length; })) return "partial";
  return "done";
}
function ruleState(id) {
  if (outs(id, "raises").some(isOpen)) return "blocked";
  return ins(id, "proves").length ? "done" : "partial";
}

// ── DOM helpers ──
//
// EVERY string below reaches the page through textContent, never through innerHTML, and that is a
// correctness rule rather than a style preference. The data island escapes the less-than sign only
// to keep a rule statement from closing the script element early — JSON.parse hands the original
// character straight back, so a statement, a question, or an OCR'd source path containing markup
// would be PARSED if it were assigned as HTML. The sources array holds pasted chat and text pulled
// out of customer screenshots: treating that as trusted markup because "we wrote the spec
// ourselves" is exactly the assumption that fails.
function tag(name, cls, txt) {
  var e = document.createElement(name);
  if (cls) e.className = cls;
  if (txt !== undefined && txt !== null) e.textContent = txt;
  return e;
}
function add(parent) {
  for (var j = 1; j < arguments.length; j++) {
    var c = arguments[j];
    if (c === null || c === undefined || c === false || c === "") continue;
    parent.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }
  return parent;
}
function hrefOf(id) { return "#n/" + encodeURIComponent(id); }
function ref(id, text) {
  if (!byId[id]) return tag("span", "ref missing", id + " (ไม่มีใน spec)");
  var a = tag("a", "ref", text || id);
  a.href = hrefOf(id);
  if (sub(byId[id])) a.title = byId[id].title;
  return a;
}
function refs(ids) {
  if (!ids.length) return null;
  var s = tag("span");
  ids.forEach(function (x, j) { if (j) add(s, " · "); add(s, ref(x)); });
  return s;
}
function pip(state) { var p = tag("span", "pip st-" + state); p.setAttribute("aria-hidden", "true"); return p; }
function gap(text, cmd) {
  var p = tag("p", "gap", text);
  if (cmd) add(p, " — ทำต่อที่ ", tag("code", null, cmd));
  return p;
}
function facts(pairs) {
  var d = tag("dl", "facts"), any = false;
  pairs.forEach(function (p) {
    if (p[1] === null || p[1] === undefined || p[1] === "") return;
    any = true;
    add(d, tag("dt", null, p[0]));
    add(d, add(tag("dd"), p[1]));
  });
  return any ? d : null;
}
function table(headers, rows, emptyText, emptyCmd) {
  if (!rows.length) return gap(emptyText, emptyCmd);
  var wrap = tag("div", "tablewrap"), t = tag("table"), hr = tag("tr"), body = tag("tbody");
  headers.forEach(function (h) { hr.appendChild(tag("th", null, h)); });
  t.appendChild(add(tag("thead"), hr));
  rows.forEach(function (r) {
    var tr = tag("tr");
    r.forEach(function (c) { tr.appendChild(add(tag("td"), c === null || c === undefined || c === "" ? "—" : c)); });
    body.appendChild(tr);
  });
  t.appendChild(body);
  wrap.appendChild(t);
  return wrap;
}
function secLink(no) { var s = secByNo[no]; var a = tag("a", null, s.no + ". " + s.title); a.href = "#s" + no; return a; }
function crumbs(parts) {
  var p = tag("p", "crumbs");
  parts.forEach(function (x, j) { if (j) add(p, " › "); add(p, x); });
  return p;
}
function wikiLink(n) {
  if (!n.page) return tag("p", "nextcmd", "ชนิดนี้ยังไม่มีหน้าใน wiki bundle");
  var a = tag("a", "wiki", "เปิดหน้าเต็มของ " + n.id + " ใน wiki");
  a.href = n.page;
  return a;
}

// ── the parts a requirement page is built from ──
function exampleBlock(exId) {
  var ex = byId[exId], box = tag("div", "example");
  add(box, add(tag("div", "exhead"), ref(exId), " ", tag("span", "chip", field(ex, "ชนิด")), " ", tag("span", "chip", field(ex, "สถานะ"))));
  var ol = tag("ol", "gwt");
  [["ถ้า", "given"], ["เมื่อ", "when"], ["ต้องได้", "then"]].forEach(function (p) {
    ol.appendChild(add(tag("li"), tag("span", "l", p[0]), field(ex, p[1]) || "—"));
  });
  box.appendChild(ol);
  return box;
}
function ruleBlock(id) {
  var r = byId[id], proofs = ins(id, "proves");
  var reds = outs(id, "raises").filter(isOpen), later = outs(id, "defers").filter(isOpen);
  var art = tag("section", "rule st-" + ruleState(id));
  add(art, add(tag("div", "rulehead"), ref(id), " ", tag("span", "chip", field(r, "ชนิด")), " ", tag("span", "chip", field(r, "สถานะ"))));
  add(art, tag("p", "statement", field(r, "ข้อความ") || r.title));
  var meta = tag("p", "rulemeta"), bits = [
    ["บังคับใช้ที่ ", field(r, "บังคับใช้โดย")],
    ["มีผลตั้งแต่ ", field(r, "มีผลตั้งแต่")],
    ["ตัวเลขถูกพินโดย ", refs(outs(id, "pinnedBy"))],
    ["เลขเฉลย ", refs(outs(id, "keyedBy"))],
    ["แทนที่ ", refs(outs(id, "supersedes"))],
  ];
  bits.forEach(function (b) { if (b[1]) meta.appendChild(add(tag("span"), b[0], b[1])); });
  if (meta.childNodes.length) art.appendChild(meta);
  var td = field(r, "แนวทางทดสอบ");
  if (td) add(art, add(tag("p", "rulemeta"), "แนวทางทดสอบ: ", td));
  if (proofs.length) proofs.forEach(function (p) { art.appendChild(exampleBlock(p)); });
  else art.appendChild(gap("ยังไม่มีตัวอย่างพิสูจน์กฎข้อนี้", "/req:example " + base(id)));
  if (reds.length) art.appendChild(flag("red", "การ์ดแดงเปิดอยู่ " + reds.length + " ใบ — บล็อก CP1 และปิดด้วยการเดาไม่ได้", reds));
  if (later.length) art.appendChild(flag("later", "เลื่อนไปถามในเฟสหน้า " + later.length + " ข้อ — บล็อก CP2 ไม่ใช่ CP1", later));
  return art;
}
function flag(kind, head, ids) {
  var d = tag("div", "flag " + kind, head), ul = tag("ul");
  ids.forEach(function (q) { ul.appendChild(add(tag("li"), ref(q), " ", field(byId[q], "คำถาม") || byId[q].title)); });
  d.appendChild(ul);
  return d;
}
function relations(n) {
  var frag = document.createDocumentFragment();
  [["ชี้ออกไปหา", OUT[n.id] || [], "to"], ["มีอะไรชี้เข้ามา", IN[n.id] || [], "from"]].forEach(function (g) {
    if (!g[1].length) return;
    frag.appendChild(tag("h2", null, g[0]));
    var ul = tag("ul", "rel");
    g[1].forEach(function (e) {
      var other = byId[e[g[2]]];
      ul.appendChild(add(tag("li"), tag("span", "how", D.relationLabel[e.rel] || e.rel), ref(other.id), sub(other) ? tag("span", "sub", clip(sub(other), 70)) : null));
    });
    frag.appendChild(ul);
  });
  return frag;
}
function sectionHead(no) {
  var s = secByNo[no], f = document.createDocumentFragment();
  f.appendChild(tag("h1", null, s.no + ". " + s.title));
  f.appendChild(add(tag("p", "state"), pip(s.state), s.stateLabel + " — " + s.detail));
  if (s.next) f.appendChild(add(tag("p", "nextcmd"), "ทำต่อที่ ", tag("code", null, s.next)));
  return f;
}

// ── views ──
var view = document.getElementById("view");
function overview() {
  var s = D.summary, m = D.meta;
  add(view, tag("h1", null, "ภาพรวม"));
  add(view, tag("p", "idline", "เอกสารความต้องการของโมดูล " + D.module + " · เลือกหัวข้อจากเมนูซ้ายเพื่อเปิดอ่านทีละเรื่อง"));
  add(view, facts([
    ["กฎที่ยังใช้อยู่", s.rules + " ข้อ"],
    ["กฎที่มีตัวอย่างพิสูจน์", s.withExample + " ข้อ" + (s.rules ? " (" + Math.round(100 * s.withExample / s.rules) + "%)" : "")],

  gcard.style.width = "";
  gcard.style.height = "";
  gcard.classList.remove("sized", "narrow");
  gbig.setAttribute("aria-pressed", "false");
}
ggrip.addEventListener("pointerdown", function (e) {
  e.preventDefault();
  var r0 = gcard.getBoundingClientRect(), x0 = e.clientX, y0 = e.clientY;
  try { ggrip.setPointerCapture(e.pointerId); } catch (err) { /* a synthetic pointer has no capture to take */ }
  function move(ev) { sizeCard(r0.width + (x0 - ev.clientX), r0.height + (y0 - ev.clientY)); gbig.setAttribute("aria-pressed", "false"); }
  function up() { ggrip.removeEventListener("pointermove", move); ggrip.removeEventListener("pointerup", up); }
  ggrip.addEventListener("pointermove", move);
  ggrip.addEventListener("pointerup", up);
});
ggrip.addEventListener("dblclick", resetCard);
gbig.addEventListener("click", function () {
  if (gbig.getAttribute("aria-pressed") === "true") { resetCard(); return; }
  var r = canvas.getBoundingClientRect();
  sizeCard(Math.min(760, r.width - 28), r.height - 110);
  gbig.setAttribute("aria-pressed", "true");
});
document.getElementById("gclose").addEventListener("click", gclear);
// Clicking empty canvas lets go of the SELECTION only. Letting go of a lock is always a deliberate
// click on its own chip, or the lock button, or "ปลดล็อกทั้งหมด".
function gclear() {
  current = null;
  gcard.hidden = true;
  paint();
}

// ── routing: the current view lives in the address, so back and forward work and a link can be shared ──
var docEl = document.getElementById("doc"), graphEl = document.getElementById("graphview");
function route(first) {
  var h = location.hash.slice(1), key = "overview", id = null;
  if (h === "graph" || h === "graph-tree") key = h;
  else if (h.indexOf("graph-tree/") === 0) {
    try { id = decodeURIComponent(h.slice(11)); } catch (e) { id = null; }
    key = id && byId[id] ? "graph-tree/" + id : "graph-tree";
  }
  else if (h.length === 2 && h.charAt(0) === "s" && secByNo[h.charAt(1)]) key = h;
  else if (h.indexOf("n/") === 0) { try { id = decodeURIComponent(h.slice(2)); } catch (e) { id = null; } key = id && byId[id] ? "n/" + id : "overview"; }
  var isGraph = key.indexOf("graph") === 0;
  docEl.hidden = isGraph;
  graphEl.hidden = !isGraph;
  document.getElementById("v-doc").setAttribute("aria-current", isGraph ? "false" : "page");
  document.getElementById("v-graph").setAttribute("aria-current", isGraph ? "page" : "false");
  if (isGraph) { showGraph(key === "graph" ? "cols" : key === "graph-tree" ? "tree" : "tree:" + id); return; }

  view.replaceChildren();
  if (key === "overview") overview();
  else if (key.charAt(0) === "s") section(key.charAt(1));
  else nodePage(byId[id]);

  // the menu marks where the reader is: the node's own row if it has one, else its section
  Object.keys(menuLinks).forEach(function (k) { menuLinks[k].removeAttribute("aria-current"); });
  var mark = menuLinks[key];
  if (!mark && id) {
    var n = byId[id], owner = null;
    if (n.kind === "BR") owner = ins(id, "owns")[0];
    if (n.kind === "NFR") owner = ins(id, "requires")[0];
    if (n.kind === "EX") { var p = outs(id, "proves")[0]; if (p) owner = ins(p, "owns")[0]; }
    mark = (owner && menuLinks["n/" + owner]) || menuLinks["s" + (SECTION_OF[n.kind] || "3")];
  }
  if (mark) { mark.setAttribute("aria-current", "page"); if (!first && mark.scrollIntoView) mark.scrollIntoView({ block: "nearest" }); }
  docEl.scrollTop = 0;
  if (!first) { var h1 = view.querySelector("h1"); if (h1) { h1.tabIndex = -1; h1.focus({ preventScroll: true }); } }
}
window.addEventListener("hashchange", function () { route(false); });
route(true);
</script>
